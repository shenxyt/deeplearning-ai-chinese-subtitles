<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>链接保存 · 待执行任务</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #eee;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    header .count { font-size: 12px; color: #5f6368; }

    .toolbar { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 6px; }
    input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #1a73e8; }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: #f1f3f4;
      color: #202124;
      white-space: nowrap;
    }
    button:hover { background: #e8eaed; }
    button.primary { background: #1a73e8; color: #fff; }
    button.primary:hover { background: #1765cc; }

    #list { max-height: 340px; overflow-y: auto; }
    .task {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 14px;
      border-bottom: 1px solid #f1f3f4;
      transition: background .3s;
    }
    .task.flash { background: #fef7e0; }
    .task input[type="checkbox"] { margin-top: 3px; cursor: pointer; }
    .task .body { flex: 1; min-width: 0; }
    .task .title {
      display: block;
      color: #1a73e8;
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .task .title:hover { text-decoration: underline; }
    .task .url {
      color: #5f6368;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .task .note { color: #3c4043; font-size: 12px; margin-top: 2px; word-break: break-all; }
    .task.done .title { color: #9aa0a6; text-decoration: line-through; }
    .task.done .note { color: #9aa0a6; }
    .task .del {
      background: none;
      color: #9aa0a6;
      padding: 0 4px;
      font-size: 15px;
      line-height: 1.4;
    }
    .task .del:hover { color: #d93025; background: none; }

    .empty { padding: 28px 14px; text-align: center; color: #9aa0a6; }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-top: 1px solid #eee;
      color: #5f6368;
      font-size: 12px;
    }
    footer button { font-size: 12px; padding: 4px 8px; }
  </style>
</head>
<body>
  <header>
    <h1>📌 待执行任务</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="toolbar">
    <div class="row">
      <button class="primary" id="saveCurrent" style="flex:1">＋ 保存当前页面</button>
    </div>
    <div class="row">
      <input type="text" id="urlInput" placeholder="粘贴链接，如 https://learn.deeplearning.ai/...">
    </div>
    <div class="row">
      <input type="text" id="noteInput" placeholder="备注（可选），如：周末看完第 3 课">
      <button id="addBtn">添加</button>
    </div>
  </div>

  <div id="list"></div>

  <footer>
    <span id="hint">链接保存在本地，不会上传</span>
    <button id="clearDone">清除已完成</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
